<section class="hero">
  <div class="hero__bg">
    <picture>
      <source media="(max-width: 576px)" srcset="
      /src/img/hero/hero-mobile.webp 1x,
      /src/img/hero/hero-mobile@2x.webp 2x,
      /src/img/hero/hero-mobile@3x.webp 3x
      ">
      <img class="hero__picture" src="/src/img/hero/hero.webp"
        srcset="/src/img/hero/hero@2x.webp 2x, /src/img/hero/hero@3x.webp 3x" alt="Обложка" width="1440" height="800"
        loading="eager">
    </picture>
  </div>
  <div class="container">
    <div class="hero__wrapper">
      <div class="hero__content">
        <h1 class="visually-hidden">Сантехник178</h1>
        <h2 class="hero__title">услуги <br> сантехника</h2>
        <p class="hero__text">Только лучшее для вашей сантехники</p>
        <button class="hero__button site-btn open-modal">
          Оставить заявку
        </button>
      </div>
      <div class="hero__box">
        <div class="container">
          <ul class="hero__list list-reset">
            <li class="hero__list-item">
              <div class="hero__list-wrap">
                <svg class="hero__img">
                  <use xlink:href="#hero/icon-1"></use>
                </svg>

              </div>
              <span class="hero__list-text">Опыт <br />
                с 2004 года</span>
            </li>
            <li class="hero__list-item">
              <div class="hero__list-wrap">
                <svg class="hero__img">
                  <use xlink:href="#hero/icon-2"></use>
                </svg>

              </div>
              <span class="hero__list-text">Гарантия <br />
                3 года</span>
            </li>
            <li class="hero__list-item">
              <div class="hero__list-wrap">
                <svg class="hero__img">
                  <use xlink:href="#hero/icon-3"></use>
                </svg>
              </div>
              <span class="hero__list-text">Без посредников</span>
            </li>
            <li class="hero__list-item">
              <div class="hero__list-wrap">
                <svg class="hero__img">
                  <use xlink:href="#hero/icon-4"></use>
                </svg>
              </div>
              <span class="hero__list-text">Качественные материалы</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
